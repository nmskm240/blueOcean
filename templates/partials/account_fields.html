<label class="form-control">
  <span class="label-text mb-2">表示名 *</span>
  <input class="input input-bordered w-full" name="name" required placeholder="デモ口座" value="{{ form.name or '' }}">
</label>
<label class="form-control md:col-span-2">
  <span class="label-text mb-2">terminal64.exe のパス</span>
  <span class="join w-full"><input class="input input-bordered join-item min-w-0 flex-1 font-mono text-sm" name="path" required readonly placeholder="ファイルを選択してください" value="{{ form.path or '' }}"><button class="btn btn-outline join-item" type="button" data-mt5-path-picker>ファイルを選択</button></span>
  <span class="mt-1 hidden text-sm text-error" data-mt5-path-error role="alert"></span>
</label>
<label class="form-control"><span class="label-text mb-2">ログインID</span><input class="input input-bordered w-full" name="login" type="number" min="1" required placeholder="12345678" value="{{ form.login or '' }}"></label>
<label class="form-control"><span class="label-text mb-2">サーバー</span><input class="input input-bordered w-full" name="server" required placeholder="Broker-Demo" value="{{ form.server or '' }}"></label>
<label class="form-control"><span class="label-text mb-2">パスワード{% if is_edit %}（変更時のみ入力）{% endif %}</span><input class="input input-bordered w-full" name="password" type="password" autocomplete="new-password" placeholder="••••••••" {% if not is_edit %}required{% endif %}></label>
<label class="label mt-7 cursor-pointer justify-start gap-3"><input class="checkbox checkbox-primary" name="portable" type="checkbox" {% if form.portable %}checked{% endif %}><span class="label-text">ポータブルモードで起動</span></label>
