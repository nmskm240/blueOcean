<!doctype html>
<html lang="ja" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body class="min-h-screen bg-base-300 text-base-content">
  <div class="drawer lg:drawer-open">
    <input id="dashboard-drawer" type="checkbox" class="drawer-toggle">

    <div class="drawer-content min-h-screen bg-base-300">
      <header class="navbar sticky top-0 z-20 min-h-16 border-b border-base-content/10 bg-base-100/85 px-4 backdrop-blur-xl lg:px-8">
        <div class="flex-none lg:hidden">
          <label for="dashboard-drawer" class="btn btn-square btn-ghost" aria-label="メニューを開く">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </label>
        </div>
        <div class="flex-1 gap-2 text-sm">
          <span class="text-base-content/40">Workspace</span><span class="text-base-content/20">/</span><span>Overview</span>
        </div>
        <div class="flex-none gap-2">
          <button class="btn btn-square btn-ghost btn-sm" aria-label="通知">
            <div class="indicator"><span class="indicator-item badge badge-error badge-xs"></span><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></div>
          </button>
          <button class="btn btn-primary btn-sm"><span class="text-lg font-light">＋</span> New report</button>
        </div>
      </header>

      <main class="mx-auto max-w-7xl p-4 sm:p-7 lg:p-10">
        <div class="mb-7 flex items-end justify-between gap-4">
          <div>
            <p class="mb-2 text-xs font-bold tracking-[.18em] text-primary">OVERVIEW</p>
            <h1 class="text-2xl font-bold sm:text-3xl">Good morning, Yuki</h1>
            <p class="mt-2 text-sm text-base-content/50">Here's what's happening in your workspace today.</p>
          </div>
          <button class="btn btn-outline btn-sm hidden border-base-content/15 sm:flex">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></svg>
            Last 30 days
            <span class="opacity-50">⌄</span>
          </button>
        </div>

        <div
          class="mb-4"
          hx-get="/partials/counters"
          hx-trigger="load, every 1s"
          hx-swap="innerHTML"
        >
          <div class="skeleton h-24 w-full"></div>
        </div>

        <div id="dashboard-content" hx-get="/partials/empty-state" hx-trigger="load" hx-swap="innerHTML">
          <div class="flex min-h-96 items-center justify-center"><span class="loading loading-ring loading-lg text-primary"></span></div>
        </div>
      </main>
    </div>

    <aside class="drawer-side z-30">
      <label for="dashboard-drawer" aria-label="メニューを閉じる" class="drawer-overlay"></label>
      <div class="flex min-h-full w-64 flex-col border-r border-base-content/10 bg-base-100 p-4">
        <a href="/" class="mb-9 flex items-center gap-3 px-2 py-2 text-xl font-bold">
          <span class="grid size-8 -rotate-6 place-items-center rounded-xl bg-primary shadow-lg shadow-primary/20"><span class="size-3 rounded-full border-[3px] border-primary-content"></span></span>
          orbit
        </a>

        <p class="mb-2 px-3 text-[10px] font-bold tracking-[.18em] text-base-content/35">WORKSPACE</p>
        <ul class="menu w-full gap-1 p-0 text-sm">
          <li><a class="active bg-primary/15 text-primary"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Overview</a></li>
          <li><a><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>Analytics</a></li>
          <li><a><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7 10 17l-5-5M15 7h5v5"/></svg>Activity</a></li>
        </ul>
        <p class="mb-2 mt-8 px-3 text-[10px] font-bold tracking-[.18em] text-base-content/35">MANAGE</p>
        <ul class="menu w-full gap-1 p-0 text-sm">
          <li><a><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4.3 3.3-7 8-7s7.4 2.7 8 7"/></svg>Team</a></li>
          <li><a><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>Settings</a></li>
        </ul>

        <div class="mt-auto flex items-center gap-3 border-t border-base-content/10 px-2 pt-5">
          <div class="avatar placeholder"><div class="w-9 rounded-full bg-primary/20 text-primary"><span class="text-xs">YK</span></div></div>
          <div class="min-w-0 flex-1"><strong class="block text-xs">Yuki Kato</strong><span class="block truncate text-[10px] text-base-content/40">yuki@example.com</span></div>
          <button class="btn btn-ghost btn-xs">•••</button>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
