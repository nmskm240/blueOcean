<!doctype html>
<html lang="ja" data-theme="night">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戦略追加 — BlueOcean</title><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head>
<body class="min-h-screen bg-base-300">
{% set active_nav = 'strategies' %}{% include "partials/navigation.html" %}
<main class="mx-auto max-w-3xl p-8">
  <a class="link text-sm" href="/strategies">← 戦略一覧へ</a><h1 class="my-7 text-3xl font-bold">戦略を追加</h1>
  {% if error %}<div class="alert alert-error mb-5">{{ error }}</div>{% endif %}
  <section class="card bg-base-100"><form action="/strategies" method="post" class="card-body grid gap-4 md:grid-cols-2">
    <label class="form-control"><span class="label-text mb-2">設定名</span><input class="input input-bordered" name="name" placeholder="EURUSD H1 デモ" required></label>
    <label class="form-control"><span class="label-text mb-2">戦略</span><select class="select select-bordered" id="definition-key" name="definition_key" required>{% for definition in definitions %}<option value="{{ definition.key }}">{{ definition.label }}</option>{% endfor %}</select></label>
    <label class="form-control"><span class="label-text mb-2">MT5アカウント（任意）</span><select class="select select-bordered" name="account_id"><option value="">使用しない</option>{% for account in accounts %}<option value="{{ account.id.value }}">{{ account.name }}</option>{% endfor %}</select></label>
    <label class="form-control"><span class="label-text mb-2">シンボル</span><input class="input input-bordered" name="symbol" value="EURUSD" required></label>
    <label class="form-control"><span class="label-text mb-2">時間足</span><select class="select select-bordered" id="timeframe" name="timeframe"><option>M1</option><option>M5</option><option>M15</option><option>H1</option><option>H4</option><option>D1</option></select></label>
    <label class="form-control"><span class="label-text mb-2">価格データ</span><select class="select select-bordered" id="data-source" name="data_source"><option value="synthetic">Synthetic Live</option><option value="yfinance">Yahoo Finance履歴</option></select></label>
    <label class="form-control"><span class="label-text mb-2">実行方法</span><select class="select select-bordered" id="execution-backend" name="execution_backend"><option value="paper">paper broker</option><option value="backtest">backtest broker</option></select></label>
    <label class="form-control" data-backtest-field hidden><span class="label-text mb-2">履歴期間</span><select class="select select-bordered" name="history_period"><option>1mo</option><option>3mo</option><option>6mo</option><option selected>1y</option><option>2y</option><option>5y</option><option>max</option></select></label>
    <label class="form-control" data-backtest-field hidden><span class="label-text mb-2">初期資金</span><input class="input input-bordered" name="initial_cash" type="number" min="1" step="any" value="100000"></label>
    <label class="form-control" data-backtest-field hidden><span class="label-text mb-2">commission</span><input class="input input-bordered" name="commission" type="number" min="0" step="any" value="0.001"></label>
    <div class="md:col-span-2"><h2 class="mb-3 font-bold">戦略パラメータ</h2>{% for definition in definitions %}<div class="grid gap-4 md:grid-cols-2" data-parameter-group="{{ definition.key }}" {% if not loop.first %}hidden{% endif %}>{% for parameter in definition.parameters %}<label class="form-control"><span class="label-text mb-2">{{ parameter.label }}</span><input class="input input-bordered" name="parameter_{{ definition.key }}_{{ parameter.name }}" type="number" value="{{ parameter.default }}" {% if parameter.value_type.__name__ == 'float' %}step="any"{% else %}step="1"{% endif %} {% if parameter.minimum is not none %}min="{{ parameter.minimum }}"{% endif %}></label>{% endfor %}</div>{% endfor %}</div>
    <div class="md:col-span-2 flex justify-end gap-2"><a class="btn btn-ghost" href="/strategies">キャンセル</a><button class="btn btn-primary">登録</button></div>
  </form></section>
</main>
<script>const selector=document.querySelector('#definition-key');function updateParameters(){document.querySelectorAll('[data-parameter-group]').forEach(group=>group.hidden=group.dataset.parameterGroup!==selector.value)}selector.addEventListener('change',updateParameters);updateParameters();const source=document.querySelector('#data-source');const backend=document.querySelector('#execution-backend');const timeframe=document.querySelector('#timeframe');const historyPeriod=document.querySelector('[name="history_period"]');const periods={M1:['1d','5d'],M5:['5d','1mo'],M15:['5d','1mo'],H1:['1mo','3mo','6mo','1y','2y'],H4:['1mo','3mo','6mo','1y','2y'],D1:['1mo','3mo','6mo','1y','2y','5y','max']};function updatePeriods(){const current=historyPeriod.value;historyPeriod.replaceChildren(...periods[timeframe.value].map(value=>new Option(value,value,false,value===current)));if(!periods[timeframe.value].includes(current))historyPeriod.value=periods[timeframe.value].at(-1)}function updateExecution(){const backtest=source.value==='yfinance';backend.value=backtest?'backtest':'paper';document.querySelectorAll('[data-backtest-field]').forEach(field=>field.hidden=!backtest);if(backtest)updatePeriods()}source.addEventListener('change',updateExecution);timeframe.addEventListener('change',updatePeriods);updateExecution();</script>
</body></html>
